<svg xmlns="http://www.w3.org/2000/svg" width="760" height="548" viewBox="0 0 760 548" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" role="img">
<title>Game state (1,201 numbers) goes into a transformer, which chooses the ship&#x27;s controls</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#9198a1"/></marker></defs>
<rect width="760" height="548" fill="#0d1117"/>
<rect x="230.0" y="14" width="300" height="54" rx="6" fill="#151b23" stroke="#3d444d" stroke-width="1"/>
<text x="380.0" y="37" font-size="15" font-weight="600" fill="#e6edf3" text-anchor="middle">Mk48 game server</text>
<text x="380.0" y="56" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="middle">local copy · unchanged game rules</text>
<path d="M380.0,68 L380.0,110" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="368.0" y="88" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="end">game state:</text>
<text x="368.0" y="103" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="end">what a player&#x27;s client is sent</text>
<g fill="none" stroke="#9198a1" stroke-width="1.4"><rect x="396.0" y="84" width="20" height="14" rx="2"/><circle cx="406.0" cy="91" r="4"/><path d="M402.0,84 l2,-3 h4 l2,3"/></g><line x1="394.0" y1="101" x2="418.0" y2="79" stroke="#e5807a" stroke-width="1.8"/>
<text x="426.0" y="96" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start">no screenshots, no computer vision</text>
<rect x="40" y="112" width="680" height="182" rx="6" fill="#151b23" stroke="#3d444d" stroke-width="1"/>
<text x="58" y="137" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="start">What the network receives at each decision</text>
<text x="58.0" y="166" font-size="13.5" font-weight="600" fill="#e6edf3" text-anchor="start">Own ship</text>
<text x="58.0" y="184" font-size="12.5" font-weight="400" fill="#78aef0" text-anchor="start">40 values</text>
<text x="58.0" y="206" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start">health, speed, heading</text>
<text x="58.0" y="223" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start">position, map edge</text>
<text x="58.0" y="240" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start">weapons ready</text>
<text x="58.0" y="257" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start">ship type, level</text>
<line x1="266.66666666666663" y1="154" x2="266.66666666666663" y2="252" stroke="#3d444d" stroke-width="1"/>
<text x="284.66666666666663" y="166" font-size="13.5" font-weight="600" fill="#e6edf3" text-anchor="start">24 nearest objects</text>
<text x="284.66666666666663" y="184" font-size="12.5" font-weight="400" fill="#78aef0" text-anchor="start">24 × 39 values</text>
<text x="284.66666666666663" y="206" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start">enemy ships, torpedoes</text>
<text x="284.66666666666663" y="223" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start">missiles, aircraft</text>
<text x="284.66666666666663" y="240" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start">barrels, coins, platforms</text>
<text x="284.66666666666663" y="257" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start">can a weapon hit it now?</text>
<line x1="493.3333333333333" y1="154" x2="493.3333333333333" y2="252" stroke="#3d444d" stroke-width="1"/>
<text x="511.3333333333333" y="166" font-size="13.5" font-weight="600" fill="#e6edf3" text-anchor="start">Local map</text>
<text x="511.3333333333333" y="184" font-size="12.5" font-weight="400" fill="#78aef0" text-anchor="start">15 × 15 grid</text>
<text x="511.3333333333333" y="206" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start">land and map edge</text>
<text x="511.3333333333333" y="223" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start">around the ship,</text>
<text x="511.3333333333333" y="240" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start">turned to its heading</text>
<line x1="58" y1="262" x2="702" y2="262" stroke="#3d444d" stroke-width="1"/>
<text x="380.0" y="284" font-size="13.5" font-weight="600" fill="#e6edf3" text-anchor="middle">40 + 24 × 39 + 15 × 15 = 1,201 numbers</text>
<path d="M380.0,294 L380.0,334" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="250.0" y="334" width="260" height="72" rx="6" fill="#14243a" stroke="#78aef0" stroke-width="1.5"/>
<text x="380.0" y="359" font-size="15" font-weight="600" fill="#e6edf3" text-anchor="middle">Transformer</text>
<text x="380.0" y="378" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="middle">2 attention layers · ~880k weights</text>
<text x="380.0" y="395" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="middle">each object is one token</text>
<path d="M380.0,406 L380.0,444" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="444" width="680" height="90" rx="6" fill="#151b23" stroke="#3d444d" stroke-width="1"/>
<text x="58" y="469" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="start">Actions, 5 times per second</text>
<rect x="58" y="482" width="56.5" height="26" rx="13" fill="#0d1117" stroke="#3d444d" stroke-width="1"/>
<text x="86.25" y="499.5" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="middle">steer</text>
<rect x="121.4" y="482" width="78.4" height="26" rx="13" fill="#0d1117" stroke="#3d444d" stroke-width="1"/>
<text x="160.60000000000002" y="499.5" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="middle">throttle</text>
<rect x="206.70000000000002" y="482" width="63.8" height="26" rx="13" fill="#0d1117" stroke="#3d444d" stroke-width="1"/>
<text x="238.60000000000002" y="499.5" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="middle">target</text>
<rect x="277.40000000000003" y="482" width="49.2" height="26" rx="13" fill="#0d1117" stroke="#3d444d" stroke-width="1"/>
<text x="302.00000000000006" y="499.5" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="middle">fire</text>
<rect x="333.50000000000006" y="482" width="63.8" height="26" rx="13" fill="#0d1117" stroke="#3d444d" stroke-width="1"/>
<text x="365.40000000000003" y="499.5" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="middle">weapon</text>
<rect x="404.20000000000005" y="482" width="56.5" height="26" rx="13" fill="#0d1117" stroke="#3d444d" stroke-width="1"/>
<text x="432.45000000000005" y="499.5" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="middle">salvo</text>
<rect x="467.6" y="482" width="49.2" height="26" rx="13" fill="#0d1117" stroke="#3d444d" stroke-width="1"/>
<text x="492.20000000000005" y="499.5" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="middle">dive</text>
<rect x="523.7" y="482" width="100.3" height="26" rx="13" fill="#0d1117" stroke="#3d444d" stroke-width="1"/>
<text x="573.85" y="499.5" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="middle">sonar/radar</text>
<rect x="630.9000000000001" y="482" width="71.1" height="26" rx="13" fill="#0d1117" stroke="#3d444d" stroke-width="1"/>
<text x="666.45" y="499.5" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="middle">upgrade</text>
<text x="58" y="524" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start">sent to the server as ordinary player commands</text>
<path d="M720,495 L746,495 L746,41 L532.0,41" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="546.0" y="34" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start">commands back to the game</text>
</svg>
